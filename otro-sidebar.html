<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otro sidebar</title>
    <style>
        .tabla{
            display:grid;
            grid-template-columns: repeat(4, 1fr);
            grid-gap: 1px;
            margin: 0 auto;
            width: 500px;
        }
        .tabla>div{
            background-color: gray;
            text-align: center;
            padding: 18px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .cabecera{
            grid-column: 1 / span 3;
            grid-row: 1;
        }
        .sidebar{
            grid-column: 4;
            grid-row: 1 / span 2;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="tabla">
    <div class="cabecera">celda 1</div>
    <div class="sidebar">celda 2</div>
    <div>celda 3</div>
    <div>celda 4</div>
    <div>celda 5</div>
    </div>
</body>
</html>
