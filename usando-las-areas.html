<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usando las Areas</title>
    <style>
        .tabla{
            display:grid;
            grid-template-columns: 100px repeat(4, 1fr);
            grid-gap: 1px;
            grid-template-areas: 
            'cabecera cabecera cabecera cabecera cabecera '
            'sidebar col1 col1 col2 col2 '
            'sidebar col3 col3 col4 col4 '; 
            justify-items: stretch;
            margin: 0 auto;
            width: 500px;
        }
        .tabla>div{
            background-color: gray;
            text-align: center;
            padding: 18px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .cabecera{
            grid-area: cabecera;
        }
        .sidebar{
            grid-area: sidebar;
        }
        .col1{
            grid-area: col1;
        }
        .col2{
            grid-area: col2;
        }
        .col3{
            grid-area: col3;
        }
        .col4{
            grid-area: col4;
        }
    </style>
</head>
<body>
    <div class="tabla">
    <div class="cabecera">usando grid-areas</div>
    <div class="sidebar">celda 2</div>
    <div class="col1">celda 3</div>
    <div class="col2">celda 4</div>
    <div class="col3">celda 5</div>
    <div class="col4">celda 6</div>
    </div>
</body>
</html>
