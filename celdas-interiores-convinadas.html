<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celdas interiores convinadas</title>
    <style>
        .tabla{
            display:grid;
            grid-template-columns: 100px repeat(4, 1fr);
            grid-gap: 1px;
            grid-template: 
            'celda1 celda1 celda2 celda2'
            'celda3 celda4 celda4 celda4'
            'celda5 celda5 celda5 celda5';
            justify-items: stretch;
            margin: 0 auto;
            width: 500px;
        }
        .tabla>div{
            background-color: gray;
            text-align: center;
            padding: 18px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        .celda1{grid-area: celda1}
        .celda2{grid-area: celda2}
        .celda3{grid-area: celda3}
        .celda4{grid-area: celda4}
        .celda5{grid-area: celda5}
    </style>
</head>
<body>
    <div class="tabla">
    <div class="celda1">celda 1</div>
    <div class="celda2">celda 2</div>
    <div class="celda3">celda 3</div>
    <div class="celda4">celda 4</div>
    <div class="celda5">celda 5</div>
    </div>
</body>
</html>
