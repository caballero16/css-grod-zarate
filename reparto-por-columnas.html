<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controlando el orden de las celdas</title>
    <style>
        .tabla{
            font-family: sans-serif;
            display: grid;
            grid-gap: 1px;
            grid-template-rows: repeat(3, auto);
            grid-auto-flow: column dense;
            margin: 0 auto;
            width: 300px;
        } 
        .tabla>div{
            background-color: gray;
            text-align: center;
            padding: 18px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>
</head>
<body>
    <div class="tabla">
    <div class="celda1">celda 1</div>
    <div class="celda2">celda 2</div>
    <div class="celda3">celda 3</div>
    <div class="celda4">celda 4</div>
    <div class="celda5">celda 5</div>
    <div class="celda6">celda 6</div>
    </div>
</body>
</html>
